<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.name|default:"Configure Camera" }} | AI Attendance System</title>
    <!-- Modern Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #060913;
            --bg-card: rgba(13, 19, 36, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --cyan-glow: #00f2fe;
            --blue-accent: #4facfe;
            --purple-accent: #7928ca;
            --emerald-glow: #10b981;
            --rose-glow: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.28;
            pointer-events: none;
            z-index: 0;
        }
        .glow-1 {
            top: -100px;
            right: 15%;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, #00f2fe, #4facfe, transparent 75%);
        }
        .glow-2 {
            bottom: -150px;
            left: 10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #7928ca, #3b82f6, transparent 75%);
        }

        .container {
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .btn-back-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 30px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .btn-back-nav:hover {
            color: var(--cyan-glow);
            border-color: rgba(0, 242, 254, 0.3);
            transform: translateX(-3px);
        }

        .form-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 
                0 0 0 1px rgba(0, 242, 254, 0.1),
                0 25px 60px -10px rgba(0, 0, 0, 0.8);
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header-custom {
            text-align: center;
            margin-bottom: 26px;
        }

        .card-header-custom h2 {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .card-header-custom p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 8px;
            display: block;
        }

        .form-control-custom {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 13px 16px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            border-color: var(--cyan-glow);
            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.15);
            background: rgba(15, 23, 42, 0.85);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 14px;
            color: #060913;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px -5px rgba(0, 242, 254, 0.6);
        }

        .hint {
            font-size: 0.78rem;
            color: #64748b;
            margin-top: 6px;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container">
        <a href="{% url 'camera_config_list' %}" class="btn-back-nav">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Camera Configurations</span>
        </a>

        <div class="form-card">
            <div class="card-header-custom">
                <h2>{{ config.name|default:"Create Camera Configuration" }}</h2>
                <p>Define hardware video stream source and recognition threshold</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="name">Camera Configuration Name</label>
                    <input type="text" id="name" name="name" class="form-control-custom" value="{{ config.name|default:'' }}" placeholder="e.g. Main Entrance Cam" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="camera_source">Camera Stream Source</label>
                    <input type="text" id="camera_source" name="camera_source" class="form-control-custom" value="{{ config.camera_source|default:'' }}" placeholder="0 or RTSP / HTTP URL" required>
                    <div class="hint">Use 0 for built-in webcam, or rtsp:// url for IP cameras.</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="threshold">Recognition Confidence Threshold</label>
                    <input type="number" step="0.01" id="threshold" name="threshold" class="form-control-custom" value="{{ config.threshold|default:0.65 }}" placeholder="0.65" required>
                    <div class="hint">Recommended: 0.60 to 0.70 for optimal face matching.</div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-save me-2"></i> Save Camera Configuration
                </button>
            </form>
        </div>
    </div>
</body>
</html>
